name: Make Project

on:
  workflow_dispatch:

jobs:

  make:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Make Project
        run: |
          ./gradlew assembleDebug

      - name: Make result
        run: |
          echo "Make Project completed successfully."
