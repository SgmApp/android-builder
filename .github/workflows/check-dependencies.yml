name: Check Dependencies

on:
  workflow_dispatch:

jobs:

  dependency-check:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x gradlew

      - name: Resolve dependencies
        run: ./gradlew dependencies
