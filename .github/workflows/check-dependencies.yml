name: Check Dependencies

on:
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Check Gradle dependencies
        run: ./gradlew dependencies

      - name: Check Gradle projects
        run: ./gradlew projects

      - name: Check Gradle tasks
        run: ./gradlew tasks

      - name: Check Android project
        run: ./gradlew assembleDebug --dry-run
