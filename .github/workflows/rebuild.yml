name: Rebuild Project

on:
  workflow_dispatch:

jobs:

  rebuild:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean Project
        run: |
          ./gradlew clean

      - name: Rebuild Project
        run: |
          ./gradlew assembleDebug

      - name: Rebuild result
        run: |
          echo "Rebuild Project completed successfully."
