name: Build Bundle

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release Bundle
        run: ./gradlew clean bundleRelease

      - name: Find generated AAB
        run: |
          echo "Generated AAB files:"
          find . -type f -name "*.aab" -print

      - name: Verify AAB
        run: |
          AAB_COUNT=$(find . -type f -name "*.aab" | wc -l)

          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "ERROR: No AAB file was created."
            exit 1
          fi

          echo "AAB build successful."

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: '**/*.aab'
          if-no-files-found: error
