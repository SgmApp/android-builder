name: Build Bundle(s)

on:
  workflow_dispatch:

jobs:

  build-bundle:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout project
        uses: actions/checkout@v4


      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==========================================
      # GRADLE
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ==========================================
      # GRADLE WRAPPER
      # ==========================================

      - name: Make gradlew executable
        run: chmod +x gradlew


      # ==========================================
      # BUILD AAB
      # ==========================================

      - name: Build Bundle(s)
        run: ./gradlew bundleDebug


      # ==========================================
      # FIND AAB
      # ==========================================

      - name: Find AAB files
        run: |
          echo "AAB files:"
          find . -type f -name "*.aab"


      # ==========================================
      # UPLOAD AAB
      # ==========================================

      - name: Upload Bundle(s)
        uses: actions/upload-artifact@v4
        with:
          name: build-bundles
          path: "**/build/outputs/bundle/**/*.aab"
          if-no-files-found: error
