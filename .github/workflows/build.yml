name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4


      # ============================================
      # JAVA
      # ============================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle


      # ============================================
      # GRADLE
      # ============================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Make gradlew executable
        run: chmod +x gradlew


      # ============================================
      # CREATE SIGNING KEYSTORE
      # ============================================

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > signing.keystore

          test -s signing.keystore


      # ============================================
      # CREATE signing.properties
      # ============================================

      - name: Create signing properties
        run: |
          cat > signing.properties <<EOF
          storeFile=signing.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF


      # ============================================
      # DEBUG
      # ============================================

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        run: ./gradlew clean assembleDebug --stacktrace


      # ============================================
      # RELEASE
      # ============================================

      - name: Build Release APK
        if: inputs.build_type == 'release'
        run: ./gradlew clean assembleRelease --stacktrace


      # ============================================
      # DEBUG OUTPUT
      # ============================================

      - name: Create Debug output.json
        if: inputs.build_type == 'debug'
        run: |
          cat > app/build/outputs/apk/debug/output.json <<'EOF'
          {
            "build_type": "debug",
            "apk_name": "app-debug.apk",
            "apk_path": "app/build/outputs/apk/debug/app-debug.apk",
            "status": "success"
          }
          EOF


      # ============================================
      # RELEASE OUTPUT
      # ============================================

      - name: Create Release output.json
        if: inputs.build_type == 'release'
        run: |
          cat > app/build/outputs/apk/release/output.json <<'EOF'
          {
            "build_type": "release",
            "apk_name": "app-release.apk",
            "apk_path": "app/build/outputs/apk/release/app-release.apk",
            "status": "success"
          }
          EOF


      # ============================================
      # UPLOAD DEBUG
      # ============================================

      - name: Upload Debug APK
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/output.json
          if-no-files-found: error


      # ============================================
      # UPLOAD RELEASE
      # ============================================

      - name: Upload Release APK
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/output.json
          if-no-files-found: error


      # ============================================
      # DELETE KEY
      # ============================================

      - name: Remove signing files
        if: always()
        run: |
          rm -f signing.keystore
          rm -f signing.properties
