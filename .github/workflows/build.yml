name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        run: ./gradlew assembleDebug

      - name: Create Debug output.json
        if: inputs.build_type == 'debug'
        run: |
          mkdir -p app/build/outputs/apk/debug
          cat > app/build/outputs/apk/debug/output.json <<'EOF'
          {
            "build_type": "debug",
            "apk_name": "app-debug.apk",
            "apk_path": "app/build/outputs/apk/debug/app-debug.apk",
            "status": "success"
          }
          EOF

      - name: Build Release APK
        if: inputs.build_type == 'release'
        run: ./gradlew assembleRelease

      - name: Create Release output.json
        if: inputs.build_type == 'release'
        run: |
          mkdir -p app/build/outputs/apk/release
          cat > app/build/outputs/apk/release/output.json <<'EOF'
          {
            "build_type": "release",
            "apk_name": "app-release.apk",
            "apk_path": "app/build/outputs/apk/release/app-release.apk",
            "status": "success"
          }
          EOF

      - name: Upload Debug APK
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/output.json
          if-no-files-found: error

      - name: Upload Release APK
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/output.json
          if-no-files-found: error
