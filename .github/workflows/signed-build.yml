name: Signed Release Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - APK
          - Android App Bundle

      module:
        description: 'Gradle module'
        required: true
        type: string
        default: app

jobs:
  signed-build:
    runs-on: ubuntu-latest

    steps:

      # =============================================
      # CHECKOUT
      # =============================================

      - name: Checkout project
        uses: actions/checkout@v4

      # =============================================
      # JAVA
      # =============================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =============================================
      # GRADLE
      # =============================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # =============================================
      # SHOW BUILD INFORMATION
      # =============================================

      - name: Show build configuration
        run: |
          echo "Build type: ${{ inputs.build_type }}"
          echo "Module: ${{ inputs.module }}"

      # =============================================
      # CHECK MODULE
      # =============================================

      - name: Check module
        run: |
          MODULE="${{ inputs.module }}"

          if [ ! -d "$MODULE" ]; then
            echo "ERROR: Module '$MODULE' not found."
            exit 1
          fi

          echo "Module found: $MODULE"

      # =============================================
      # CHECK SIGNING FILES
      # =============================================

      - name: Check signing configuration
        run: |
          if [ ! -f .signing/release.keystore ]; then
            echo "ERROR: .signing/release.keystore not found."
            exit 1
          fi

          if [ ! -f .signing/release.password ]; then
            echo "ERROR: .signing/release.password not found."
            exit 1
          fi

          echo "Signing configuration found."

      # =============================================
      # BUILD APK / AAB
      # =============================================

      - name: Build signed release
        run: |
          MODULE="${{ inputs.module }}"

          if [ "${{ inputs.build_type }}" = "APK" ]; then
            echo "Building signed APK..."
            ./gradlew clean :${MODULE}:assembleRelease
          else
            echo "Building signed Android App Bundle..."
            ./gradlew clean :${MODULE}:bundleRelease
          fi

      # =============================================
      # FIND OUTPUT
      # =============================================

      - name: Find build output
        id: find-output
        shell: bash
        run: |
          MODULE="${{ inputs.module }}"

          if [ "${{ inputs.build_type }}" = "APK" ]; then
            FILE=$(find "$MODULE/build/outputs/apk" -type f -name "*.apk" | head -n 1)
          else
            FILE=$(find "$MODULE/build/outputs/bundle" -type f -name "*.aab" | head -n 1)
          fi

          if [ -z "$FILE" ]; then
            echo "ERROR: Build output was not found."
            exit 1
          fi

          echo "Build output: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      # =============================================
      # UPLOAD ARTIFACT
      # =============================================

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ inputs.build_type == 'APK' && 'apk' || 'aab' }}
          path: ${{ steps.find-output.outputs.file }}
          if-no-files-found: error
