name: Signed Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - APK
          - AAB

      module:
        description: "Gradle module"
        required: true
        default: "app"

jobs:

  signed-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ============================================
      # CREATE KEYSTORE
      # ============================================

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > signing.jks

      # ============================================
      # BUILD APK
      # ============================================

      - name: Build signed APK
        if: ${{ inputs.build_type == 'APK' }}
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./${{ inputs.module }}/gradlew \
            :${{ inputs.module }}:assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ============================================
      # BUILD AAB
      # ============================================

      - name: Build signed AAB
        if: ${{ inputs.build_type == 'AAB' }}
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./${{ inputs.module }}/gradlew \
            :${{ inputs.module }}:bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ============================================
      # APK ARTIFACT
      # ============================================

      - name: Upload APK
        if: ${{ inputs.build_type == 'APK' }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: |
            ${{ inputs.module }}/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ============================================
      # AAB ARTIFACT
      # ============================================

      - name: Upload AAB
        if: ${{ inputs.build_type == 'AAB' }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab
          path: |
            ${{ inputs.module }}/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # ============================================
      # DELETE KEYSTORE
      # ============================================

      - name: Remove keystore
        if: always()
        run: |
          rm -f signing.jks
