name: Signed Release Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "APK"
        type: choice
        options:
          - APK
          - Android App Bundle

      module:
        description: "Gradle module"
        required: true
        default: "app"
        type: string


jobs:

  signed-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Make gradlew executable
        run: chmod +x gradlew


      # ==========================================
      # CREATE SIGNING DIRECTORY
      # ==========================================

      - name: Prepare signing files
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

        run: |

          mkdir -p .signing

          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "ERROR: SIGNING_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "ERROR: SIGNING_STORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "ERROR: SIGNING_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "ERROR: SIGNING_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > .signing/release.keystore

          printf '%s' "$SIGNING_STORE_PASSWORD" > .signing/release.password
          printf '%s' "$SIGNING_KEY_ALIAS" > .signing/release.alias
          printf '%s' "$SIGNING_KEY_PASSWORD" > .signing/release.keypassword

          chmod 600 .signing/release.keystore
          chmod 600 .signing/release.password
          chmod 600 .signing/release.alias
          chmod 600 .signing/release.keypassword

          echo "Signing files prepared."


      # ==========================================
      # CHECK SIGNING
      # ==========================================

      - name: Check signing configuration
        run: |

          if [ ! -f .signing/release.keystore ]; then
            echo "ERROR: release.keystore not found."
            exit 1
          fi

          if [ ! -f .signing/release.password ]; then
            echo "ERROR: release.password not found."
            exit 1
          fi

          if [ ! -f .signing/release.alias ]; then
            echo "ERROR: release.alias not found."
            exit 1
          fi

          if [ ! -f .signing/release.keypassword ]; then
            echo "ERROR: release.keypassword not found."
            exit 1
          fi

          echo "Signing configuration found."


      # ==========================================
      # BUILD
      # ==========================================

      - name: Build signed APK
        if: ${{ inputs.build_type == 'APK' }}
        run: |

          ./gradlew clean \
            :${{ inputs.module }}:assembleRelease


      # ==========================================
      # BUILD AAB
      # ==========================================

      - name: Build signed App Bundle
        if: ${{ inputs.build_type == 'Android App Bundle' }}
        run: |

          ./gradlew clean \
            :${{ inputs.module }}:bundleRelease


      # ==========================================
      # VERIFY APK
      # ==========================================

      - name: Verify APK
        if: ${{ inputs.build_type == 'APK' }}
        run: |

          APK="${{ inputs.module }}/build/outputs/apk/release/${{ inputs.module }}-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find "${{ inputs.module }}/build/outputs" -type f || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"


      # ==========================================
      # VERIFY AAB
      # ==========================================

      - name: Verify AAB
        if: ${{ inputs.build_type == 'Android App Bundle' }}
        run: |

          AAB="${{ inputs.module }}/build/outputs/bundle/release/${{ inputs.module }}-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not created."
            find "${{ inputs.module }}/build/outputs" -type f || true
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB"


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload signed APK
        if: ${{ inputs.build_type == 'APK' }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: ${{ inputs.module }}/build/outputs/apk/release/${{ inputs.module }}-release.apk
          if-no-files-found: error


      # ==========================================
      # UPLOAD AAB
      # ==========================================

      - name: Upload signed AAB
        if: ${{ inputs.build_type == 'Android App Bundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-aab
          path: ${{ inputs.module }}/build/outputs/bundle/release/${{ inputs.module }}-release.aab
          if-no-files-found: error


      # ==========================================
      # CLEAN SIGNING FILES
      # ==========================================

      - name: Remove signing files
        if: always()
        run: |

          rm -rf .signing

          echo "Signing files removed."
