name: Generate Signed Bundle APK

on:
  workflow_dispatch:
    inputs:

      output_type:
        description: Output type
        required: true
        default: apk
        type: choice
        options:
          - apk
          - bundle

jobs:

  signed-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Check signing files
        run: |

          if [ ! -f .signing/release.keystore ]; then
            echo "ERROR: release.keystore not found"
            exit 1
          fi

          if [ ! -f .signing/release.password ]; then
            echo "ERROR: release.password not found"
            exit 1
          fi

          echo "Release signing files found."


      - name: Make gradlew executable
        run: chmod +x gradlew


      # ============================================
      # SIGNED APK
      # ============================================

      - name: Build Signed APK
        if: inputs.output_type == 'apk'
        run: |

          ./gradlew clean
          ./gradlew assembleRelease


      # ============================================
      # SIGNED BUNDLE
      # ============================================

      - name: Build Signed Bundle
        if: inputs.output_type == 'bundle'
        run: |

          ./gradlew clean
          ./gradlew bundleRelease


      # ============================================
      # VERIFY APK
      # ============================================

      - name: Verify Signed APK
        if: inputs.output_type == 'apk'
        run: |

          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi


      # ============================================
      # VERIFY BUNDLE
      # ============================================

      - name: Verify Signed Bundle
        if: inputs.output_type == 'bundle'
        run: |

          if [ ! -f app/build/outputs/bundle/release/app-release.aab ]; then
            echo "ERROR: Signed Bundle was not created."
            exit 1
          fi


      # ============================================
      # UPLOAD APK
      # ============================================

      - name: Upload Signed APK
        if: inputs.output_type == 'apk'
        uses: actions/upload-artifact@v4
        with:

          name: signed-apk

          path: |
            app/build/outputs/apk/release/app-release.apk

          if-no-files-found: error


      # ============================================
      # UPLOAD BUNDLE
      # ============================================

      - name: Upload Signed Bundle
        if: inputs.output_type == 'bundle'
        uses: actions/upload-artifact@v4
        with:

          name: signed-bundle

          path: |
            app/build/outputs/bundle/release/app-release.aab

          if-no-files-found: error
