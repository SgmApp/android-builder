def signingDir = file('.signing')

def signingPasswordFile = new File(signingDir, 'release.password')

def releasePassword = signingPasswordFile.text.trim()

android {
    signingConfigs {
        release {
            storeFile file('.signing/release.keystore')
            storePassword releasePassword
            keyAlias 'release'
            keyPassword releasePassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
