plugins {
    id 'com.android.application'
}

android {

    namespace "com.example.athan"

    compileSdk 35

    defaultConfig {

        applicationId "com.example.athan"

        minSdk 26

        targetSdk 35

        versionCode 1

        versionName "1.0"
    }


    // =====================================================
    // SIGNING
    // =====================================================

    signingConfigs {

        release {

            storeFile file(".signing/release.keystore")

            storePassword file(
                    ".signing/release.password"
            ).text.trim()

            keyAlias "release"

            keyPassword file(
                    ".signing/release.password"
            ).text.trim()
        }
    }


    // =====================================================
    // BUILD TYPES
    // =====================================================

    buildTypes {

        // -------------------------------------------------
        // DEBUG
        // -------------------------------------------------

        debug {

            minifyEnabled false

            /*
             * IMPORTANT:
             *
             * Use the same fixed signing key for debug.
             *
             * This is required because GitHub Actions
             * creates a fresh runner for every build.
             *
             * Without this, Android's default debug key
             * can change between builds and the APK cannot
             * update an already installed version.
             */

            signingConfig signingConfigs.release
        }


        // -------------------------------------------------
        // RELEASE
        // -------------------------------------------------

        release {

            minifyEnabled false

            signingConfig signingConfigs.release

            proguardFiles(
                    getDefaultProguardFile(
                            'proguard-android-optimize.txt'
                    ),
                    'proguard-rules.pro'
            )
        }
    }


    // =====================================================
    // JAVA
    // =====================================================

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17

        targetCompatibility JavaVersion.VERSION_17
    }


    // =====================================================
    // VIEW BINDING
    // =====================================================

    buildFeatures {

        viewBinding true
    }
}


// =========================================================
// DEPENDENCIES
// =========================================================

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.activity:activity:1.9.2'

    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
}